# PhoneInfoga; Portainer LAN Stack; fork: https://github.com/hoangthang0106/phoneinfoga
# Dedicated OSINT host range 29001-29099; host port is only a CANDIDATE. Confirm on actual VM/LXC before deployment.
services:
  phoneinfoga:
    image: sundowndev/phoneinfoga:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["serve"]
  gateway:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - phoneinfoga
    security_opt:
      - no-new-privileges:true
    ports:
      - "${LAN_IP:?ENTER_LAN_IP}:${PHONEINFOGA_HOST_PORT:-29004}:80/tcp"
    environment:
      AUTH_USER: "${OSINT_AUTH_USER:?ENTER_USERNAME}"
      AUTH_HASH: "${OSINT_AUTH_HASH:?ENTER_BCRYPT_HASH}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        printf '%s\n' ':80 {' '  basic_auth {' "    $$AUTH_USER $$AUTH_HASH" '  }' '  reverse_proxy phoneinfoga:5000' '}' > /etc/caddy/Caddyfile
        caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
