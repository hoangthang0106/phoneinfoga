# PhoneInfoga; Portainer LAN Stack; fork: https://github.com/hoangthang0106/phoneinfoga
# Sequential 1889x OSINT LAN ports; availability is not verified until checked on Docker VM/LXC.
services:
  phoneinfoga:
    image: sundowndev/phoneinfoga:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["serve", "--port", "18897"]
  gateway:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - phoneinfoga
    security_opt:
      - no-new-privileges:true
    ports:
      - "${LAN_IP:?ENTER_LAN_IP}:${PHONEINFOGA_HOST_PORT:-18897}:18897/tcp"
    environment:
      AUTH_USER: "${OSINT_AUTH_USER:?ENTER_USERNAME}"
      AUTH_PASSWORD: "${OSINT_AUTH_PASSWORD:?ENTER_PASSWORD_IN_PORTAINER}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        HASH=$$(caddy hash-password --algorithm bcrypt --plaintext "$$AUTH_PASSWORD")
        printf '%s\n' ':18897 {' '  basic_auth {' "    $$AUTH_USER $$HASH" '  }' '  reverse_proxy phoneinfoga:18897' '}' > /etc/caddy/Caddyfile
        caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
